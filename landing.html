<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Marketing site shell (canteramanager.com). Intentionally has NO
         manifest link and no service worker: the installable PWA is the app on
         app.canteramanager.com, and a second install target pointing at a
         marketing page would be wrong. See vercel.json for the host mapping. -->
    <title>Cantera Manager — youth soccer club operations</title>
    <link rel="canonical" href="https://canteramanager.com/" />
    <meta
      name="description"
      content="Cantera Manager runs U.S. youth soccer teams — roster, schedule, dues, documents, and parent updates in one app that works on the sideline."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://canteramanager.com/" />
    <meta property="og:site_name" content="Cantera Manager" />
    <meta property="og:title" content="Cantera Manager — run the club, not the spreadsheet" />
    <meta
      property="og:description"
      content="Roster, schedule, ledger, budgets, compliance, and a parent portal for youth soccer clubs. Offline-first, installable, English &amp; Español."
    />
    <meta property="og:image" content="https://canteramanager.com/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#343a40" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing-main.jsx"></script>
  </body>
</html>
